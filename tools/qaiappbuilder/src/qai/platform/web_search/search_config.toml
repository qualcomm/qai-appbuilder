# Independent web search — the ``web`` provider's engine roster + tuning.
#
# This roster ships to BOTH editions: the ``web`` provider (baidu / bing /
# mojeek / google_browser / brave / tavily / gemini) is available internally
# AND externally. It lives here in the shared-kernel package
# ``qai.platform.web_search`` (NOT under the external-excluded
# ``qai.platform.edition``), read by ``config.get_search_engines()`` /
# ``config.get_independent_search_config()`` via tomllib.
#
# Each [[search_engines]] entry declares one engine loaded by
# qai.platform.web_search.independent.engine_loader via ``handler_class``
# (importlib). Adding/removing an engine = editing this array only; no code
# change in the loader / provider / bridge. The api_key is NOT stored here — a
# keyed engine names a ``credential_key`` read from the SecretStore namespace
# qai.model_catalog.provider (same store the CEBot bridge uses).
#
# engine_type: "http_keyless" | "http_api" | "browser".
# enabled_by_default: false hides an engine from the default fallback until the
#   user turns it on. requires_credential: true engines are skipped (shown as
#   "needs config") until their credential_key is provisioned.
# priority_hint: tie-break order when every engine's health score is equal
#   (notably the first search); higher first. Also drives the display order in
#   the Settings → Search panel, so it is the single source of truth for "which
#   engine should we lean on" and must not be duplicated in the frontend.
#
#   The credential-free band (93-100) is ordered by MEASURED result quality, not
#   by guesswork: relevance / authority / snippet coverage / cross-engine
#   uniqueness / latency over a mixed query set, scored on both the direct and
#   the proxied route (see docs/85-tasks/web-search-engine-roster-and-reachability).
#   Route-independent engines rank above proxy-only ones so the order does not
#   flip when the proxy is toggled. Re-measure before reshuffling these.
#
#   Credential-free engines occupy 93-100 and therefore outrank every keyed
#   engine (max 92): they cost nothing to try and need no provisioning.
# ---------------------------------------------------------------------------
