# ---------------------------------------------------------------------------
# Engines ported from the reference implementation (parity work).
#
# ``priority_hint`` intentionally does NOT copy the reference implementation's chain order. the reference implementation orders
# answer-synthesizing providers first (perplexity, gemini, anthropic, codex,
# xai); this aggregator instead merges ranked hits from several engines, so the
# hint means "try the most reliably reachable engine first". Keyless engines
# that need no provisioning therefore outrank credentialed ones, matching the
# existing entries above. Relative order *within* the credentialed group follows
# the reference implementation.
# ---------------------------------------------------------------------------

[[search_engines]]
