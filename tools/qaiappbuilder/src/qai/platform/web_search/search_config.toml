# Aggregator + browser + health-scoring knobs (platform-operator tuning; users
# cannot override these from forge_config). Read by the ``web`` provider via
# get_independent_search_config().
#
# Two-tier wait policy for the keyless phase (every enabled engine is started
# CONCURRENTLY; these bound how long the merge waits for them):
#   * soft_deadline_seconds — the "good enough" checkpoint. If at least 2 engines
#     have produced hits by now, return and cancel the stragglers.
#   * hard_deadline_seconds — the ceiling. When the soft checkpoint had fewer
#     than 2 contributors, keep waiting up to here for more sources to land.
#
# Sized from MEASURED latency, not guessed: plain-HTTP engines answer in
# 1.5-2.7s, Exa's MCP path routinely needs ~6s, and the browser upgrade longer.
# The former 5s soft deadline cut exactly where Exa lands — the engine with the
# highest measured authority — letting one fast-but-weak engine define the whole
# result set. Re-measure before changing these.
[independent_search]
soft_deadline_seconds = 10.0
hard_deadline_seconds = 20.0
# Kept below soft_deadline: a browser engine that has not answered within the
# soft window is not going to beat the plain-HTTP engines, and letting its
# minimum wait exceed the checkpoint would silently push every search past it.
browser_min_wait_seconds = 9.0

[independent_search.browser]
idle_close_seconds = 60.0

[independent_search.scoring]
score_max = 50
score_min = -50
initial_score = 0
disable_threshold = -25
daily_change_cap = 3
dedup_window_seconds = 300
consecutive_fails_hard = 20
