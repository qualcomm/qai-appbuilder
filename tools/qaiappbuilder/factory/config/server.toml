# Server deployment config (overrides code defaults; lower priority than env / CLI overrides).
#
# NOTE: do NOT hard-code [auth].enabled here. The auth master switch is
# platform-dependent by default (AuthSettings.enabled via default_factory ->
# settings._default_auth_enabled):
#   * Windows ARM64/x64      -> True
#   * Linux WITH a graphical session (DISPLAY / WAYLAND_DISPLAY set, e.g. an
#     Ubuntu desktop that has a browser for the Okta loopback callback) -> True
#   * Linux headless (server / container / IoT board, no DISPLAY) -> False,
#     because the gate would 303 every request to /auth/login with nothing able
#     to complete the flow.
# Pinning it here would force one value globally on ALL platforms and defeat
# that per-platform gate — in particular it would lock out headless Linux
# deployments. Only set [auth].enabled below to intentionally override the
# platform default for a specific deployment.
#
# Example (commented out — uncomment only to force a non-default value):
# [auth]
# enabled = true
[auth]
enabled = true

# ---------------------------------------------------------------------------
# Chat tunables
# ---------------------------------------------------------------------------
# P1 (slow on-device decoding): inter-frame stall budget, in seconds. This is
# the max wall-clock gap between two MEANINGFUL LLM stream frames before a turn
# is treated as a wedged upstream and stopped. It is an IDLE-GAP limit, not a
# whole-turn cap — a healthy stream resets it on every frame that carries real
# progress, so raising it only extends how long a genuinely silent upstream is
# tolerated.
#
# The code default is 1800.0, chosen for slow on-device endpoints (a 27B model
# decoding at 6-7 tok/s can legitimately spend >600s on one complex round).
# Uncomment and adjust only to deviate from that:
#   * faster device / cloud-only deployment -> lower it (e.g. 600.0, the
#     historical value) to detect a wedged upstream sooner;
#   * even slower device -> raise it further;
#   * 0.0 disables the watchdog entirely (a wedged turn then pins the tab
#     "generating" until the user presses Stop — not recommended).
#
# Env-var equivalent: QAI_CHAT__FRAME_STALL_BUDGET_SECONDS=1800
#
# [chat]
# frame_stall_budget_seconds = 1800.0
