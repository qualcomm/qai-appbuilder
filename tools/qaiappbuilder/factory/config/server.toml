# Server deployment config (overrides code defaults; lower priority than env / CLI overrides).
#
# NOTE: do NOT hard-code [auth].enabled here. The auth master switch is
# platform-dependent by default (AuthSettings.enabled via default_factory ->
# settings._default_auth_enabled):
#   * Windows ARM64/x64      -> True
#   * Linux WITH a graphical session (DISPLAY / WAYLAND_DISPLAY set, e.g. an
#     Ubuntu desktop that has a browser for the Okta loopback callback) -> True
#   * Linux headless (server / container / IoT board, no DISPLAY) -> False,
#     because the gate would 303 every request to /auth/login with nothing able
#     to complete the flow.
# Pinning it here would force one value globally on ALL platforms and defeat
# that per-platform gate — in particular it would lock out headless Linux
# deployments. Only set [auth].enabled below to intentionally override the
# platform default for a specific deployment.
#
# Example (commented out — uncomment only to force a non-default value):
# [auth]
# enabled = true
[auth]
enabled = true

# Backend logging (data\logs\backend.log + console). Every key is optional; the
# values shown are the code defaults. Environment variables win over this file,
# e.g. QAI_LOGGING__LEVEL=DEBUG. Restart the backend after a change.
# NOTE: this file is part of the program and is replaced on reinstall / upgrade,
# so keep diagnostic tweaks here temporary.
#
# [logging]
# level = "INFO"              # DEBUG / INFO / WARNING / ERROR / CRITICAL
# file_enabled = true         # false = console only, no data\logs\*.log
# file_max_mb = 10            # size of one log file before it rolls over
# file_backup_count = 5       # rolled-over files kept: backend.log.1 .. .5
# file_fmt = "console"        # "console" (plain text) or "json"
# # HTTP requests whose URL contains one of these strings are not logged
# # (warnings / errors still are). Default: the local aria2c download RPC,
# # polled twice a second while a download runs, and the local model service
# # readiness probe (GenieAPIService /status, default port 8910 - change it here
# # if you moved the service to another port). [] logs every request.
# mute_http_urls = ["127.0.0.1:6800/jsonrpc", "127.0.0.1:6810/jsonrpc", "127.0.0.1:8910/status"]
